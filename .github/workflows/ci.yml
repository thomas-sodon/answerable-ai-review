name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'metronome' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Lint and type-check once: the results do not depend on the runtime
      # Python (mypy already targets 3.11 via pyproject).
      - name: Ruff
        if: matrix.python-version == '3.14'
        run: python -m ruff check src/ tests/
      - name: Mypy
        if: matrix.python-version == '3.14'
        run: python -m mypy src/
      - name: Pytest
        run: python -m pytest tests/ -v

  # release-please reads the Conventional Commit titles merged to main (see
  # pr-title.yml) and keeps a release PR open that bumps pyproject.toml,
  # src/answerable/__init__.py, the manifest and CHANGELOG.md. Merging that PR
  # tags vX.Y.Z and creates the GitHub release; the next step then moves the vX
  # major tag that users reference (@v0).
  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # A release PR opened with GITHUB_TOKEN would get no CI runs, so Mergify
      # could never merge it. RELEASE_TOKEN needs contents, pull requests and
      # issues (labels) write access.
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Add a RELEASE_TOKEN secret: release PRs opened with GITHUB_TOKEN get no CI"
            exit 1
          fi
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v5
      - name: Publish release and move major tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # Works from the manifest version rather than release-please's outputs,
        # so it is idempotent: re-running a job that failed part-way finishes
        # the release, and a version bumped by hand (all three files, which
        # tests/test_version.py checks) is still released.
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          TAG="v$version"
          MAJOR="v${version%%.*}"
          ref_exists() { gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" --silent 2>/dev/null; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          elif ref_exists "$TAG"; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
          fi

          # Point the major tag at the release's commit, not this push's: a
          # later merge that keeps the version must not move it past the release.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if ref_exists "$MAJOR"; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MAJOR" --jq .sha)
            if [ "$current" = "$sha" ]; then
              echo "::notice::$TAG is released and $MAJOR already points at $sha"
              exit 0
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" -f sha="$sha" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$sha" --silent
          fi
          echo "::notice::Released $TAG and moved $MAJOR to $sha"
